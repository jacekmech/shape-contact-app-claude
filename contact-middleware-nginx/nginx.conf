upstream contact-api {
    server contact-api:3001;
}

upstream contact-frontend {
    server contact-frontend:5173;
}

server {
    listen 80;

    # Route /api/* to the backend — full path preserved (no prefix stripping)
    location /api/ {
        proxy_pass http://contact-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Route everything else to the frontend
    # WebSocket upgrade headers required for Vite HMR
    location / {
        proxy_pass http://contact-frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
