services:
  contact-api:
    build:
      context: ../contact-api
    environment:
      PORT: 3000
      HELLO_MESSAGE: ${HELLO_MESSAGE:-Hello, World!}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    networks:
      - app

  contact-frontend:
    build:
      context: ../contact-frontend
    environment:
      VITE_API_BASE_URL: /api
    networks:
      - app

  contact-middleware-nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ../contact-middleware-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - contact-api
      - contact-frontend
    networks:
      - app

networks:
  app:
    driver: bridge
