services:
  contact-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../contact-middleware-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - contact-api
      - contact-frontend

  contact-api:
    build:
      context: ../contact-api
    environment:
      HELLO_MESSAGE: ${HELLO_MESSAGE:-Hello, World!}
      PORT: 3001
      SMTP_HOST: contact-mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      EMAIL_FROM: ${EMAIL_FROM:-contact@localhost}
      EMAIL_TO: ${EMAIL_TO:-owner@localhost}
    expose:
      - "3001"
    depends_on:
      - contact-mailhog

  contact-frontend:
    build:
      context: ../contact-frontend
    expose:
      - "5173"

  contact-mailhog:
    image: mailhog/mailhog
    expose:
      - "1025"
    ports:
      - "8025:8025"
