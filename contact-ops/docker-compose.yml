services:
  contact-api:
    build:
      context: ../contact-api
    environment:
      PORT: 3000
      HELLO_MESSAGE: ${HELLO_MESSAGE:-Hello, World!}
    networks:
      - app

  contact-frontend:
    build:
      context: ../contact-frontend
    environment:
      VITE_API_BASE_URL: /api
    networks:
      - app

  contact-middleware-nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ../contact-middleware-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - contact-api
      - contact-frontend
    networks:
      - app

networks:
  app:
    driver: bridge
